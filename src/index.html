<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paper Register - Patient Grouped View</title>

<script
  src="https://meromiti.com/mero-miti.js"
  data-mero-miti-auto="true"
  data-mero-miti-auto-sync="true"
  data-mero-miti-locale="en"
  data-mero-miti-format="YYYY-MM-DD">
</script>

<!-- SheetJS for export (matches existing vendored stack — swap this CDN line
     for the locally vendored xlsx.full.min.js copy used elsewhere in the suite). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {--border: #cfd8dc; --header-bg: #f5f7f8; --patient-bg: #fbfcfc;--accent: #2c6e91;}
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px;border-bottom: 1px solid #ccc;background: #ddd; padding: 10px; }
  .controls label { display: block; font-size: 12px; color: #555; margin-bottom: 3px; }
  .controls select, .controls input, .controls button {
    padding: 6px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px;
  }
  .controls button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  .controls button.secondary { background: #eee; color: #333; border: 1px solid var(--border); }
  .controls button:hover { opacity: 0.9; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .toolbar .right { display: flex; gap: 8px; align-items: center; }
  table.register {border-collapse: collapse;width: 100%;font-size: 12.5px;}
  table.register th, table.register td {border: 1px solid var(--border);padding: 6px 8px;text-align: left;vertical-align: top;}
  table.register thead th {background: var(--header-bg);font-weight: 600;white-space: nowrap;cursor: pointer;user-select: none;
  }
  table.register thead th.sortable:hover { background: #eceff1; }
  table.register thead th .arrow { font-size: 10px; opacity: 0.6; margin-left: 4px; }
  table.register td.attr-cell {background: var(--patient-bg);font-weight: 500;vertical-align: middle;}
  table.register tr.new-patient td {border-top: 2px solid var(--accent);}
  .status-msg { font-size: 12px; color: #666; margin: 6px 0; }
  .status-msg.error { color: #b00020; }
  .pagination { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; }
  .pagination button { padding: 4px 10px; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }

  .mero-miti-input-group{border: none !important; background: none !important;}
  .mero-miti-input{background:#fff !important}
  
  #printTable { display: none; }

  @media print {
    .controls, .toolbar, .pagination, #statusMsg { display: none !important; }
    #screenTable { display: none !important; }
    #printTable { display: table !important; }
  }
</style>
</head>
<body>

<h1>Register View</h1>

<div class="controls">
  <div>
    <label>Register Config</label>
    <select id="configSelect">
      <option value="">-- Select Report --</option>
    </select>
  </div>
  <div>
    <label>Start date (AD)</label>
    <input type="date" id="startDate">
  </div>
  <div>
    <label>End date (AD)</label>
    <input type="date" id="endDate">
  </div>
  <div>
    <button id="fetchBtn">Fetch &amp; Render</button>
  </div>
</div>

<div id="statusMsg" class="status-msg"></div>

<div class="toolbar">
  <div>
    <input type="text" id="searchInput" placeholder="Search patients..." style="width:220px;">
  </div>
  <div class="right">
    <label style="margin:0;">Rows/page:
      <select id="pageSizeSelect">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </label>
    <button id="exportBtn" class="secondary">Export Excel</button>
    <button id="printBtn" class="secondary">Print</button>
  </div>
</div>

<table id="screenTable" class="register" style="width:100%">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table>

<div class="pagination">
  <button id="prevPageBtn">&laquo; Prev</button>
  <span id="pageIndicator"></span>
  <button id="nextPageBtn">Next &raquo;</button>
</div>

<!-- Print-only: renders ALL filtered patients regardless of pagination -->
<table id="printTable" class="register" style="width:100%"></table>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  baseUrl: '/ephc/api',
};

/* =========================================================================
   STATE — the single source of truth is `allPatients`; everything else
   (filteredPatients, sort, page) is a view over it.
   ========================================================================= */
let allPatients = [];       // [{ tei, attrs: [...], visits: [[...],[...]] }]
let attrColumnNames = [];
let visitColumns = [];
let filteredPatients = [];
let sortState = { columnIndex: -1, direction: 1 }; // -1 = no sort (source order)
let currentPage = 1;
let pageSize = 20;

/* =========================================================================
   1. FETCH: eventVisualization config -> analytics JSON (unchanged from
      the earlier version — this part was never the problem).
   ========================================================================= */
// Real field shape, confirmed by the user — attributeDimensions and
// dataElementDimensions are separate arrays (not one flat list), and
// programStage/program are top-level fields rather than derived from
// individual dimension entries.
const EVENT_VIZ_FIELDS = 'id,name,attributeDimensions,dataElementDimensions,type,program,programStage,columnDimension,metadata';

async function fetchEventVisualizationConfig(id) {
  const res = await fetch(`${CONFIG.baseUrl}/eventVisualizations/${id}.json?fields=${EVENT_VIZ_FIELDS}`);
  if (!res.ok) throw new Error(`Failed to load eventVisualization ${id}: ${res.status}`);
  return res.json();
}

// Populates #configSelect with the real list of saved eventVisualizations
// (Line Listing reports) instead of the hardcoded demo options. Without
// this, configSelect only ever has "anc_demo"/"imm_demo" as values, so
// fetchEventVisualizationConfig only ever gets called with ids that don't
// exist on the server — this is what actually wires it to real data.
// filter=type:eq:LINE_LIST restricts the list to Line List reports only
// (type is the chart/report type — COLUMN, PIVOT_TABLE, LINE_LIST, etc. —
// not EVENT/ENROLLMENT/TRACKED_ENTITY_INSTANCE output scope).
async function populateConfigDropdown() {
  try {
    const res = await fetch(`${CONFIG.baseUrl}/eventVisualizations.json?fields=${EVENT_VIZ_FIELDS}&filter=type:eq:LINE_LIST&paging=false`);
    if (!res.ok) throw new Error(`Failed to list eventVisualizations: ${res.status}`);
    const data = await res.json();
    const select = document.getElementById('configSelect');

    // Keep the demo entries (useful for testing without a live instance),
    // append real ones below a separator.
    if (data.eventVisualizations && data.eventVisualizations.length) {
      data.eventVisualizations
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.id;
          opt.textContent = ev.name;
          select.appendChild(opt);
        });
    }
  } catch (err) {
    console.error('Could not load eventVisualization list:', err);
    setStatus('Could not load report list — check connection to DHIS2.', true);
  }
}

function buildAnalyticsUrl(evConfig, startDate, endDate, ou) {
  const programId = evConfig.program?.id;
  const stageId = evConfig.programStage?.id;
  if (!programId) throw new Error('eventVisualization config has no program id.');
  if (!stageId) throw new Error('eventVisualization config has no programStage — only EVENT-scoped LINE_LIST configs are supported currently.');

  // Bare (un-prefixed) ids from each dimension array.
  const attrIds = (evConfig.attributeDimensions || [])
    .map(a => a.attribute?.id || a.attribute).filter(Boolean);
  const deIds = (evConfig.dataElementDimensions || [])
    .map(d => d.dataElement?.id || d.dataElement).filter(Boolean);
  const deIdSet = new Set(deIds);

  // Column order: respect evConfig.columnDimension if the server provides
  // an explicit ordering (array of bare dimension ids); otherwise fall
  // back to ou, eventDate, then attributes, then data elements.
  const orderedIds = Array.isArray(evConfig.columnDimension) && evConfig.columnDimension.length
    ? evConfig.columnDimension
    : ['ou', 'eventDate', ...attrIds, ...deIds];

  // Full dimension id as DHIS2 expects it in dimension=/asc= params:
  // bare for 'ou'/'eventDate'/attributes, 'stage.dataElement' for DEs.
  const toFullDim = (bareId) => deIdSet.has(bareId) ? `${stageId}.${bareId}` : bareId;
  const columnDims = orderedIds.map(toFullDim);
  const nonSpecial = columnDims.filter(d => d !== 'ou' && d !== 'eventDate');

  // Patient identity key: first non-ou/non-eventDate dimension, matching
  // the real query's asc= sort convention — not a literal TEI column,
  // since the query never requests one.
  const patientKeyDim = nonSpecial[0];

  // columns= strips the stage prefix off stage-scoped dims; keeps 'ou'/'eventDate' as-is.
  const columnsParam = columnDims.map(d => d.includes('.') ? d.split('.')[1] : d).join(';');
  // headers= keeps the full 'stage.de' form; 'ou'→'ouname', 'eventDate'→'eventdate'.
  const headerSpecial = { ou: 'ouname', eventDate: 'eventdate' };
  const headersParam = columnDims.map(d => headerSpecial[d] || d).join(',');

  const params = new URLSearchParams({
    startDate,
    endDate,
    displayProperty: 'SHORTNAME',
    tableLayout: 'true',
    dataIdScheme: 'NAME',
    paging: 'false',
    columns: columnsParam,
    headers: headersParam,
  });
  if (patientKeyDim) params.set('asc', patientKeyDim);
  params.set('dimension', `ou:${ou || 'USER_ORGUNIT'}`);
  nonSpecial.forEach(d => params.append('dimension', d));
  params.set('stage', stageId);
  params.set('outputType', 'EVENT');

  return {
    url: `${CONFIG.baseUrl}/analytics/events/query/${programId}.json?${params.toString()}`,
    patientKeyDim,
    columnDims
  };
}

async function fetchAnalyticsJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Analytics fetch failed: ${res.status}`);
  return res.json();
}

function parseAnalyticsResponse(json) {
  const headers = json.headers.map(h => ({ name: h.name, column: h.column, valueType: h.valueType }));
  return { headers, rows: json.rows };
}

/* =========================================================================
   2. GROUP BY PATIENT — builds the patients data model directly (no
      separate "flatten" step; visits stay nested per patient).
   ========================================================================= */
// patientKeyCol: the dimension used as patient identity (e.g. a Health ID
// attribute) — NOT necessarily a literal TEI UID column. The real query
// shape doesn't request a dedicated TEI dimension at all; grouping has to
// key off whichever attribute actually identifies the patient.
function groupByPatient(rows, headers, attrCols, dateColumnName, patientKeyCol) {
  const teiIdx = headers.findIndex(h => h.column === patientKeyCol || h.name === patientKeyCol);
  const dateIdx = headers.findIndex(h => h.column === dateColumnName || h.name === dateColumnName);
  const attrIdx = attrCols.map(name => headers.findIndex(h => h.column === name || h.name === name));
  const visitIdx = visitColumns.map(name => headers.findIndex(h => h.column === name || h.name === name));

  if (teiIdx === -1) throw new Error(`Patient key column "${patientKeyCol}" not found in analytics response.`);

  const map = {};
  rows.forEach(row => {
    const tei = row[teiIdx];
    if (!map[tei]) {
      map[tei] = {
        tei,
        attrs: attrIdx.map(i => row[i] ?? ''),
        visits: []
      };
    }
    map[tei].visits.push(visitIdx.map(i => row[i] ?? ''));
    map[tei]._rawRows = map[tei]._rawRows || [];
    map[tei]._rawRows.push(row);
  });

  // Sort each patient's visits chronologically using the raw date value.
  Object.values(map).forEach(p => {
    const paired = p.visits.map((v, i) => ({ v, raw: p._rawRows[i] }));
    paired.sort((a, b) => new Date(a.raw[dateIdx]) - new Date(b.raw[dateIdx]));
    p.visits = paired.map(x => x.v);
    delete p._rawRows;
  });

  return Object.values(map);
}

/* =========================================================================
   2b. GROUP BY PATIENT — FIXED COLUMNS mode (immunization-style).
      No visit indexing: each column is a specific data element, and its
      value is whichever of the patient's events in this stage actually
      carries a value for that DE — scanned in event order, first found
      wins. Every patient produces exactly ONE row (visits: [oneRow]),
      which the existing renderer already handles correctly since
      rowspan=1 on a single row is a visual no-op.
   ========================================================================= */
function groupByPatientFixedColumns(rows, headers, attrCols, columnDefs, dateColumnName, patientKeyCol) {
  const teiIdx = headers.findIndex(h => h.column === patientKeyCol || h.name === patientKeyCol);
  const dateIdx = headers.findIndex(h => h.column === dateColumnName || h.name === dateColumnName);
  const attrIdx = attrCols.map(name => headers.findIndex(h => h.column === name || h.name === name));
  const colIdx = columnDefs.map(name => headers.findIndex(h => h.column === name || h.name === name));

  if (teiIdx === -1) throw new Error(`Patient key column "${patientKeyCol}" not found in analytics response.`);

  const map = {};
  rows.forEach(row => {
    const tei = row[teiIdx];
    if (!map[tei]) map[tei] = { tei, attrs: attrIdx.map(i => row[i] ?? ''), _rows: [] };
    map[tei]._rows.push(row);
  });

  return Object.values(map).map(p => {
    // Event order matters for "first found wins" when a DE could theoretically
    // appear more than once — chronological keeps it deterministic.
    const sortedRows = [...p._rows].sort((a, b) => new Date(a[dateIdx]) - new Date(b[dateIdx]));
    const fixedRow = colIdx.map(i => {
      for (const row of sortedRows) {
        if (row[i]) return row[i];
      }
      return '';
    });
    return { tei: p.tei, attrs: p.attrs, visits: [fixedRow] };
  });
}

/* =========================================================================
   3. FILTER / SORT (block-level — a patient is a unit, never split)
   ========================================================================= */
function applyFilterAndSort() {
  const term = $val('searchInput').trim().toLowerCase();

  filteredPatients = !term ? allPatients.slice() : allPatients.filter(p => {
    const inAttrs = p.attrs.some(v => String(v).toLowerCase().includes(term));
    const inVisits = p.visits.some(visit => visit.some(v => String(v).toLowerCase().includes(term)));
    return inAttrs || inVisits;
  });

  if (sortState.columnIndex >= 0) {
    const idx = sortState.columnIndex;
    const isAttr = idx < attrColumnNames.length;
    filteredPatients.sort((a, b) => {
      let av, bv;
      if (isAttr) {
        av = a.attrs[idx]; bv = b.attrs[idx];
      } else {
        // Sort by first visit's value in that visit column.
        const visitIdx = idx - attrColumnNames.length;
        av = a.visits[0] ? a.visits[0][visitIdx] : '';
        bv = b.visits[0] ? b.visits[0][visitIdx] : '';
      }
      return String(av).localeCompare(String(bv)) * sortState.direction;
    });
  }
}

/* =========================================================================
   4. RENDER — rowspan is set once, at creation, never patched afterward.
   ========================================================================= */
function buildHeaderRow(target) {
  target.innerHTML = '';
  [...attrColumnNames, ...visitColumns].forEach((name, i) => {
    const th = document.createElement('th');
    th.textContent = name;
    if (target.id !== 'printHeaderRow') {
      th.classList.add('sortable');
      th.addEventListener('click', () => {
        sortState = sortState.columnIndex === i
          ? { columnIndex: i, direction: -sortState.direction }
          : { columnIndex: i, direction: 1 };
        currentPage = 1;
        applyFilterAndSort();
        renderScreenTable();
      });
      if (sortState.columnIndex === i) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = sortState.direction === 1 ? '\u25B2' : '\u25BC';
        th.appendChild(arrow);
      }
    }
    target.appendChild(th);
  });
}

function buildPatientRows(patients, tbody) {
  patients.forEach(p => {
    const visitCount = Math.max(p.visits.length, 1);
    p.visits.length === 0 && p.visits.push(visitColumns.map(() => ''));

    p.visits.forEach((visit, i) => {
      const tr = document.createElement('tr');
      if (i === 0) tr.classList.add('new-patient');

      if (i === 0) {
        p.attrs.forEach(val => {
          const td = document.createElement('td');
          td.className = 'attr-cell';
          td.rowSpan = visitCount;
          td.textContent = val;
          tr.appendChild(td);
        });
      }
      // Subsequent visit rows deliberately get NO attribute <td>s at all —
      // the rowspan from the first row's cells covers them. This is set at
      // creation time, so there's no redraw/patch step that can get it wrong.

      visit.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
}

function renderScreenTable() {
  const thead = document.querySelector('#screenTable thead tr');
  const tbody = document.querySelector('#screenTable tbody');
  buildHeaderRow(thead);
  tbody.innerHTML = '';

  const totalPages = Math.max(1, Math.ceil(filteredPatients.length / pageSize));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * pageSize;
  const pagePatients = filteredPatients.slice(start, start + pageSize);

  buildPatientRows(pagePatients, tbody);

  document.getElementById('pageIndicator').textContent =
    `Page ${currentPage} / ${totalPages} — ${filteredPatients.length} patients`;
  document.getElementById('prevPageBtn').disabled = currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

  renderPrintTable(); // keep the print-all view in sync
}

function renderPrintTable() {
  const printTable = document.getElementById('printTable');
  printTable.innerHTML = '';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.id = 'printHeaderRow';
  thead.appendChild(headRow);
  buildHeaderRow(headRow);
  printTable.appendChild(thead);

  const tbody = document.createElement('tbody');
  buildPatientRows(filteredPatients, tbody); // ALL filtered patients, no pagination
  printTable.appendChild(tbody);
}

/* =========================================================================
   5. EXPORT (SheetJS) — reads the patients data model directly, so the
      exported sheet has attribute values correctly repeated per visit row
      regardless of how the screen table currently looks.
   ========================================================================= */
function exportToExcel() {
  const aoa = [[...attrColumnNames, ...visitColumns]];
  filteredPatients.forEach(p => {
    p.visits.forEach(visit => {
      aoa.push([...p.attrs, ...visit]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Register');
  XLSX.writeFile(wb, 'paper-register.xlsx');
}

/* =========================================================================
   6. WIRING
   ========================================================================= */
function $val(id) { return document.getElementById(id).value; }
function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}

document.getElementById('fetchBtn').addEventListener('click', async () => {
  const configId = $val('configSelect');
  // These are type="date" inputs with a Mero Miti BS companion attached —
  // .value is already Gregorian (YYYY-MM-DD) by the time the user has
  // picked a date through the companion, see note above buildAnalyticsUrl.
  const startDate = $val('startDate');
  const endDate = $val('endDate');
  if (!configId || !startDate || !endDate) {
    setStatus('Select a report and both dates.', true);
    return;
  }
  try {
    setStatus('Loading config...');
    const evConfig = await fetchEventVisualizationConfig(configId);

    setStatus('Fetching analytics...');
    const { url, patientKeyDim, columnDims } = buildAnalyticsUrl(evConfig, startDate, endDate);
    const json = await fetchAnalyticsJson(url);
    const { headers, rows } = parseAnalyticsResponse(json);

    // Classify by POSITION against columnDims, not by matching header text
    // to a UID — dataIdScheme=NAME means headers come back as resolved
    // names, not the UIDs we requested, so string-matching against the
    // dimension list would silently find nothing. Response header order is
    // expected to mirror the columns=/headers= param order we built.
    attrColumnNames = [];
    visitColumns = [];
    headers.forEach((h, i) => {
      const dim = columnDims[i];
      const label = h.column || h.name;
      if (dim === 'eventDate' || (dim && dim.includes('.'))) {
        visitColumns.push(label); // stage-scoped DE, or the visit's own event date
      } else {
        attrColumnNames.push(label); // 'ou' or a bare tracked-entity attribute
      }
    });

    // Resolve the patient-key dimension to its actual response label the
    // same way (position-based), since groupByPatient matches by that
    // label against header.column/name, not by the raw dimension UID.
    const keyIdx = columnDims.indexOf(patientKeyDim);
    const patientKeyCol = keyIdx >= 0 ? (headers[keyIdx].column || headers[keyIdx].name) : undefined;
    if (!patientKeyCol) throw new Error('Could not resolve patient key column from response headers.');

    // Mode inference is a placeholder — this should come from the section's
    // own config (visit-rows vs fixed-columns), not be guessed from the id.
    const isFixedColumns = /imm/i.test(configId);
    allPatients = isFixedColumns
      ? groupByPatientFixedColumns(rows, headers, attrColumnNames, visitColumns, visitColumns[0], patientKeyCol)
      : groupByPatient(rows, headers, attrColumnNames, visitColumns[0], patientKeyCol);
    sortState = { columnIndex: -1, direction: 1 };
    currentPage = 1;
    applyFilterAndSort();
    renderScreenTable();
    setStatus(`Loaded ${allPatients.length} patients, ${rows.length} visits.`);
  } catch (err) {
    console.error(err);
    setStatus(err.message, true);
  }
});

document.getElementById('searchInput').addEventListener('input', () => {
  currentPage = 1;
  applyFilterAndSort();
  renderScreenTable();
});

document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
  pageSize = parseInt(e.target.value, 10);
  currentPage = 1;
  renderScreenTable();
});

document.getElementById('prevPageBtn').addEventListener('click', () => {
  currentPage = Math.max(1, currentPage - 1);
  renderScreenTable();
});
document.getElementById('nextPageBtn').addEventListener('click', () => {
  currentPage += 1;
  renderScreenTable();
});

document.getElementById('exportBtn').addEventListener('click', exportToExcel);
document.getElementById('printBtn').addEventListener('click', () => window.print());

populateConfigDropdown();
</script>
</body>
</html>
